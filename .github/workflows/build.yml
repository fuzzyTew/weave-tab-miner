# Builds weave-tab-miner.html, runs the checks, publishes the page to GitHub Pages from
# main, and attaches the page to a GitHub release when a tag like v0.1.0 is pushed.
name: Build, test and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the single-file page
        run: node build_single_file.mjs

      - name: Check SHA-256, VDF, difficulty and layout against block 2,040,257
        run: node test_against_block.mjs sample_block.json

      - name: Check real RandomX H0 and packing against block 2,040,257
        run: node test_randomx_against_block.mjs

      - name: Check the VDF server reply parser
        run: node test_vdf_update.mjs

      - name: Check transactions against arweave-js
        run: |
          npm install --no-save arweave@1.15.5
          node cross_check_transactions.mjs .

      - name: Check the built page in a headless browser
        run: |
          npm install --no-save playwright@1.47.2
          npx playwright install --with-deps chromium
          node check_page.cjs weave-tab-miner.html

      - name: Keep the built page as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: weave-tab-miner
          path: weave-tab-miner.html

      - name: Prepare the GitHub Pages site
        run: |
          mkdir -p site
          cp weave-tab-miner.html site/index.html

      - name: Upload the GitHub Pages site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: weave-tab-miner

      - name: Attach the page to a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" weave-tab-miner.html --repo "$GITHUB_REPOSITORY" --generate-notes
