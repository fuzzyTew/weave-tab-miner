# Builds dist/weave-tab-miner.html, runs the checks, publishes the page to GitHub Pages from
# main, and attaches the page to a GitHub release when a tag like v0.1.0 is pushed.
#
# The library checks and the browser check run as parallel jobs. Test dependencies come
# from package-lock.json through the npm cache, and the browser check drives the runner's
# preinstalled Google Chrome, so no browser is downloaded.
name: Build, test and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  # Daily, so the gateway and node list the page carries stays fresh.
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install test dependencies
        run: npm ci --ignore-scripts

      - name: Check SHA-256, VDF, difficulty and layout against block 2,040,257
        run: node test/against-block.test.mjs

      - name: Check real RandomX H0 and packing against block 2,040,257
        run: node test/randomx-against-block.test.mjs

      - name: Check the VDF server reply parser
        run: node test/vdf-update.test.mjs

      - name: Check the Solana gateway registry decoder against ar.io's encoder
        run: node test/solana-registry.test.mjs

      - name: Check the wait estimate's arithmetic
        run: node test/odds.test.mjs

      - name: Fetch the localnet blocks and state (localnet-fixtures branch)
        run: git fetch --depth 1 origin localnet-fixtures && git archive FETCH_HEAD | tar x

      - name: Check the account tree against the localnet's blocks
        run: node test/account-tree.test.mjs localnet_fixtures

      - name: Check the history hashes against the localnet's blocks
        run: node test/block-history.test.mjs localnet_fixtures

      - name: Check the plain block fields against the localnet's blocks
        run: node test/block-fields.test.mjs localnet_fixtures

      - name: Check block ids, signatures and signing against the localnet's blocks
        run: node test/block-hash.test.mjs localnet_fixtures && node test/block-signer.test.mjs localnet_fixtures

      - name: Check ANS-104 data items against arbundles' output
        run: node test/data-item.test.mjs

      - name: Check transactions against arweave-js
        run: node test/transactions.test.mjs

  live-network:
    # Tries every request the page makes against real gateways and nodes. The network can
    # be flaky, so a failure here is reported without blocking the build or Pages.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Try every live request
        run: node scripts/live-network-check.mjs

  page:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install test dependencies
        run: npm ci --ignore-scripts

      - name: Gather gateways and nodes that answer from here
        # A failed gathering keeps the committed data/sources.json, so the build still works.
        continue-on-error: true
        timeout-minutes: 5
        run: node scripts/gather-sources.mjs data/sources.json

      - name: Build the single-file page
        run: node scripts/build-single-file.mjs

      - name: Check the built page in the runner's Chrome
        env:
          PLAYWRIGHT_CHANNEL: chrome
        run: node test/check-page.cjs dist/weave-tab-miner.html

      - name: Keep the built page as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: weave-tab-miner
          path: |
            dist/weave-tab-miner.html
            data/sources.json

      - name: Prepare the GitHub Pages site
        run: |
          mkdir -p site
          cp dist/weave-tab-miner.html site/index.html

      - name: Upload the GitHub Pages site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    if: github.ref == 'refs/heads/main'
    needs: [library-checks, page]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [library-checks, page]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: weave-tab-miner

      - name: Attach the page to a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/weave-tab-miner.html --repo "$GITHUB_REPOSITORY" --generate-notes
