# Starts an Arweave localnet (a private chain started from the snapshot in Arweave's
# repository). Three modes:
#   capture — the node's own miner makes a few blocks, and each is committed with its
#             parent's state to the localnet-fixtures branch; the block builder is checked
#             against those blocks offline.
#   post    — this library mines blocks itself and posts them (scripts/localnet-post.mjs);
#             the run passes when the node takes every one as its new tip.
#   page    — the built page, in headless Chrome, presses its one-button start against the
#             node (through scripts/localnet-proxy.mjs) and mines and posts blocks on its own
#             (scripts/localnet-page.mjs); the run passes when the node takes `blocks` of them.
# Manual only: building Arweave takes a while, so it stays out of the per-push checks.
name: Localnet fixtures

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "capture: the node mines blocks and they are saved as fixtures; post: this library mines blocks and posts them to the node; page: a browser tab does, from its one button"
        type: choice
        options: [capture, post, page]
        default: capture
      blocks:
        description: Blocks to mine (and save, or post)
        default: '3'
      vdf_steps:
        description: "post mode: build blocks on VDF steps computed after the parent's (as on mainnet), or on the parent's own step (localnet only)"
        type: choice
        options: [computed, same]
        default: computed

permissions:
  contents: write

env:
  # The Arweave commit this project's citations and ports were read from.
  ARWEAVE_COMMIT: 18d402c714132e1de3962b12ff32a420127e0c02
  LOCALNET_NODE: main-localnet@127.0.0.1
  # The node mines its own blocks only in capture mode, which needs its data packed.
  LOCALNET_PACKING: ${{ inputs.mode == 'capture' && 'replica_2_9' || 'unpacked' }}
  ERL_EPMD_ADDRESS: 127.0.0.1

jobs:
  capture:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '26.2.5'

      - name: Check out Arweave at the pinned commit, with the snapshot's LFS files
        run: |
          git init arweave
          cd arweave
          git remote add origin https://github.com/ArweaveTeam/arweave.git
          git fetch --depth 1 origin "$ARWEAVE_COMMIT"
          git checkout FETCH_HEAD
          git submodule update --init --recursive --depth 1
          git lfs install --local
          git lfs pull --include "localnet_snapshot/**"
          du -sh localnet_snapshot

      # _build links to the native libraries (RandomX, VDF, secp256k1) compiled into
      # apps/arweave/priv, so both are kept; without priv, a skipped compile leaves the node
      # unable to load them.
      - name: Reuse an earlier build
        id: arweave-build
        uses: actions/cache@v4
        with:
          path: |
            arweave/_build
            arweave/apps/arweave/priv
          key: arweave-localnet-with-native-${{ env.ARWEAVE_COMMIT }}

      # A build cached for the pinned commit needs neither the tools nor compiling again
      # (together about 2 minutes).
      - name: Install build tools
        if: steps.arweave-build.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libgmp-dev libssl-dev pkg-config

      - name: Build the localnet profile
        if: steps.arweave-build.outputs.cache-hit != 'true'
        working-directory: arweave
        run: ./ar-rebar3 localnet compile

      # The node's data directory just after it first started (accounts and blocks copied
      # from the snapshot, seed data stored and, if packed, packed), so later runs start
      # from it. Saved right after starting, before any block is mined or posted, while the
      # node idles (mining off, no syncing); RocksDB recovers a copy taken then as from a
      # crash. If a restored copy ever fails to start, delete this cache in the Actions tab.
      - name: Reuse the node's data directory from an earlier start
        id: localnet-data
        uses: actions/cache/restore@v4
        with:
          path: arweave/.tmp/data_localnet_main
          key: localnet-data-${{ env.ARWEAVE_COMMIT }}-${{ env.LOCALNET_PACKING }}

      - name: Start the localnet
        working-directory: arweave
        run: |
          mkdir -p .tmp
          started=$(date +%s)
          ERL_LOCALNET_OPTS="-pa $(./rebar3 as localnet path) $(./rebar3 as localnet path --base)/lib/arweave/test -config config/sys.config"
          echo "$(( $(date +%s) - started )) s: paths ready; starting the node with $LOCALNET_PACKING storage"
          # An unpacked storage module needs no RandomX packing; only capture mode, where the
          # node mines its own blocks, needs it packed (ar_localnet:start uses any modules set).
          if [ "$LOCALNET_PACKING" = unpacked ]; then
            START='arweave_config:start(), ok = arweave_config:set([storage_modules], [{0, 21 * 1048576, unpacked}]), ar:shell_localnet().'
          else
            START='ar:shell_localnet().'
          fi
          nohup erl $ERL_LOCALNET_OPTS -name "$LOCALNET_NODE" -setcookie localnet -noshell \
            -eval "$START" -eval "timer:sleep(infinity)." > .tmp/localnet.log 2>&1 &
          node_pid=$!
          shown=0
          last_growth=$(date +%s)
          # Gives up at once if the node exits, or after 60 s without a new log line: a
          # healthy start logs each stage as it goes (a cold start took about 3 minutes).
          for tick in $(seq 1 1200); do
            if ! kill -0 "$node_pid" 2>/dev/null; then echo "the node exited during startup; its log:"; tail -200 .tmp/localnet.log; exit 1; fi
            # Each new log line, marked with the seconds since this step began.
            total=$(wc -l < .tmp/localnet.log)
            if [ "$total" -gt "$shown" ]; then
              tail -n +$((shown + 1)) .tmp/localnet.log | head -n $((total - shown)) | sed "s/^/$(( $(date +%s) - started )) s: /"
              shown=$total
              last_growth=$(date +%s)
            fi
            if [ $(( $(date +%s) - last_growth )) -gt 60 ]; then echo "no new log line for 60 s; the node's log:"; tail -200 .tmp/localnet.log; exit 1; fi
            info=$(curl -fsS --max-time 1 -H 'x-network: arweave.localnet' http://127.0.0.1:1984/info 2>/dev/null || true)
            if echo "$info" | grep -q '"height":[0-9]'; then echo "$(( $(date +%s) - started )) s: ready: $info"; exit 0; fi
            sleep 0.5
          done
          echo "localnet did not start; its log:"; tail -200 .tmp/localnet.log; exit 1

      - name: Save the node's data directory for later runs
        if: steps.localnet-data.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: arweave/.tmp/data_localnet_main
          key: localnet-data-${{ env.ARWEAVE_COMMIT }}-${{ env.LOCALNET_PACKING }}

      - name: Mine and save blocks
        if: inputs.mode == 'capture'
        env:
          LOCALNET_MINE_COMMAND: >-
            erl -name capture@127.0.0.1 -setcookie localnet -noshell -eval
            "io:format(\"~p~n\", [rpc:call('main-localnet@127.0.0.1', ar_localnet, mine_one_block, [])]), halt()."
        run: node scripts/localnet-capture.mjs localnet_fixtures "${{ inputs.blocks }}"

      - name: Mine blocks with this library and post them to the node
        if: inputs.mode == 'post'
        run: node scripts/localnet-post.mjs "${{ inputs.blocks }}" "${{ inputs.vdf_steps }}"

      - name: Let a browser tab mine and post blocks to the node
        if: inputs.mode == 'page'
        env:
          PLAYWRIGHT_CHANNEL: chrome
        run: |
          npm ci --ignore-scripts
          node scripts/build-single-file.mjs
          nohup node scripts/localnet-proxy.mjs 1985 http://127.0.0.1:1984 > localnet-proxy.log 2>&1 &
          node scripts/localnet-page.mjs "${{ inputs.blocks }}" 20 http://127.0.0.1:1985

      - name: Keep the page's last screenshot
        if: always() && inputs.mode == 'page'
        uses: actions/upload-artifact@v4
        with:
          name: localnet-page
          path: |
            localnet-page.png
            localnet-proxy.log
          if-no-files-found: ignore

      - name: Show the localnet log
        if: always()
        run: tail -300 arweave/.tmp/localnet.log || true

      - name: Commit the fixtures to the localnet-fixtures branch
        if: inputs.mode == 'capture'
        run: |
          git config user.name "localnet workflow"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan localnet-fixtures
          git rm -rq --cached .
          git add localnet_fixtures
          git commit -qm "Localnet blocks and state from Arweave $ARWEAVE_COMMIT"
          git push -f origin localnet-fixtures
          du -sh localnet_fixtures; ls -la localnet_fixtures
